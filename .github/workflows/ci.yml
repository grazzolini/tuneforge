name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci-scope:
    runs-on: ubuntu-latest
    outputs:
      backend_static: ${{ steps.scope.outputs.backend_static }}
      backend_ffmpeg: ${{ steps.scope.outputs.backend_ffmpeg }}
      desktop: ${{ steps.scope.outputs.desktop }}
      site: ${{ steps.scope.outputs.site }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine CI scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          backend_static=false
          backend_ffmpeg=false
          desktop=false
          site=false
          full_gate=false
          changed_files="${RUNNER_TEMP}/changed-files.txt"

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            full_gate=true
            : > "${changed_files}"
          else
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            if ! git diff --name-only "${base_sha}" "${head_sha}" > "${changed_files}"; then
              echo "Could not compute changed files; running the full gate." >&2
              full_gate=true
              : > "${changed_files}"
            fi
          fi

          if [[ -s "${changed_files}" ]]; then
            while IFS= read -r path; do
              case "${path}" in
                scripts/capture-release-media.mjs|scripts/check-release-version.mjs)
                  site=true
                  ;;
                scripts/package-options*|scripts/flatpak-options*|scripts/playback-smoke*|scripts/sync-validation*|scripts/setup-dev*)
                  ;;
                scripts/*)
                  full_gate=true
                  ;;
                package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                  site=true
                  ;;
                apps/backend/pyproject.toml|apps/backend/uv.lock)
                  backend_static=true
                  backend_ffmpeg=true
                  ;;
                apps/backend/README.md)
                  ;;
                apps/backend/app/api/*|apps/backend/app/schemas.py|apps/backend/app/main.py)
                  backend_static=true
                  backend_ffmpeg=true
                  desktop=true
                  ;;
                apps/backend/*)
                  backend_static=true
                  backend_ffmpeg=true
                  ;;
                packages/shared-types/AGENTS.md)
                  ;;
                apps/desktop/*|packages/shared-types/*)
                  desktop=true
                  ;;
                apps/site/*|.github/workflows/pages.yml)
                  site=true
                  ;;
                .github/workflows/ci.yml)
                  full_gate=true
                  ;;
                .agents/*|.codex/environments/*|docs/*|CHANGELOG.md|README.md|CONTRIBUTING.md|CODE_OF_CONDUCT.md|LICENSE|THIRD_PARTY_NOTICES.md|SECURITY.md|AGENTS.md|.gitignore|packaging/flatpak/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md)
                  ;;
                *)
                  full_gate=true
                  ;;
              esac
            done < "${changed_files}"
          fi

          if [[ "${full_gate}" == "true" ]]; then
            backend_static=true
            backend_ffmpeg=true
            desktop=true
            site=true
          fi

          print_scope_decision() {
            local label="$1"
            local enabled="$2"

            if [[ "${enabled}" == "true" ]]; then
              echo "- Include ${label}"
            else
              echo "- Skip ${label}"
            fi
          }

          echo "Final CI scope decision:"
          print_scope_decision "backend static checks" "${backend_static}"
          print_scope_decision "backend FFmpeg tests" "${backend_ffmpeg}"
          print_scope_decision "desktop checks" "${desktop}"
          print_scope_decision "site checks" "${site}"

          {
            echo "backend_static=${backend_static}"
            echo "backend_ffmpeg=${backend_ffmpeg}"
            echo "desktop=${desktop}"
            echo "site=${site}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## CI scope"
            echo
            echo "- Backend static checks: ${backend_static}"
            echo "- Backend FFmpeg tests: ${backend_ffmpeg}"
            echo "- Desktop checks: ${desktop}"
            echo "- Site checks: ${site}"
            if [[ -s "${changed_files}" ]]; then
              echo
              echo "<details><summary>Changed files</summary>"
              echo
              sed 's/^/- `/' "${changed_files}" | sed 's/$/`/'
              echo
              echo "</details>"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.cjs

      - name: Set up pnpm
        if: github.event_name == 'pull_request'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Set up Node
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install commitlint
        if: github.event_name == 'pull_request'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint PR title (squash commit message)
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint --config commitlint.pr-title.config.cjs

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Test deterministic Node scripts
        run: node --test scripts/build-info.test.mjs scripts/package-options.test.mjs scripts/flatpak-options.test.mjs scripts/playback-smoke.test.mjs scripts/sync-validation.test.mjs scripts/release-license-inventory.test.mjs scripts/capture-release-media.test.mjs

      - name: Check release script syntax
        run: |
          node --check scripts/capture-release-media.mjs
          node --check scripts/check-release-version.mjs
          node --check scripts/release-license-inventory.mjs

      - name: Check release version consistency
        run: node scripts/check-release-version.mjs

      - name: Test setup-dev script
        run: bash scripts/setup-dev.test.sh

      - name: Test Android toolchain helper
        run: bash scripts/android-arm64-env.test.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize E2E job
        shell: bash
        run: |
          set -euo pipefail
          e2e_root="${RUNNER_TEMP}/tuneforge-e2e"
          e2e_tmpdir="${e2e_root}/tmp"
          e2e_artifact_dir="${e2e_root}/failure-artifacts"
          mkdir -p "${e2e_tmpdir}" "${e2e_artifact_dir}"
          {
            echo "E2E_JOB_STARTED_AT=$(date +%s)"
            echo "E2E_TMPDIR=${e2e_tmpdir}"
            echo "E2E_ARTIFACT_DIR=${e2e_artifact_dir}"
          } >> "${GITHUB_ENV}"

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync backend dependencies
        working-directory: apps/backend
        run: uv sync --locked --all-groups

      - name: Install FFmpeg
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          elapsed_seconds=$(($(date +%s) - started_at))
          {
            echo "## E2E FFmpeg setup"
            echo
            echo "- Duration: ${elapsed_seconds}s"
            echo "- $(ffmpeg -version | sed -n '1p')"
            echo "- $(ffprobe -version | sed -n '1p')"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install Playwright Chromium
        run: pnpm --filter @tuneforge/desktop exec playwright install --with-deps chromium

      - name: Run E2E smoke
        shell: bash
        run: |
          set -uo pipefail
          started_at="$(date +%s)"
          raw_log="${RUNNER_TEMP}/tuneforge-e2e/e2e-command.raw.log"
          sanitized_log="${E2E_ARTIFACT_DIR}/e2e-command.log"

          set +e
          TMPDIR="${E2E_TMPDIR}" pnpm --filter @tuneforge/desktop test:e2e -- --ci 2>&1 | tee "${raw_log}"
          e2e_exit_code="${PIPESTATUS[0]}"
          set -e

          command_elapsed_seconds=$(($(date +%s) - started_at))
          sed \
            -e "s|${GITHUB_WORKSPACE}|<GITHUB_WORKSPACE>|g" \
            -e "s|${RUNNER_TEMP}|<RUNNER_TEMP>|g" \
            -e "s|${HOME}|<HOME>|g" \
            "${raw_log}" > "${sanitized_log}"

          {
            echo "## E2E smoke"
            echo
            echo "- E2E command duration: ${command_elapsed_seconds}s"
            echo
            echo "| Group | Result | Duration |"
            echo "| --- | --- | --- |"
            found_group_result=false
            group_result_pattern='^\[playback-smoke\] group ([a-z-]+): (passed|failed) in ([0-9.]+s)\.$'
            while IFS= read -r line; do
              if [[ "${line}" =~ ${group_result_pattern} ]]; then
                printf '| %s | %s | %s |\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}"
                found_group_result=true
              fi
            done < "${raw_log}"
            if [[ "${found_group_result}" != "true" ]]; then
              echo "| n/a | no result emitted | n/a |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          if (( command_elapsed_seconds > 180 )); then
            echo "::warning::E2E command exceeded the 3-minute target (${command_elapsed_seconds}s)."
          fi

          exit "${e2e_exit_code}"

      - name: Stage E2E failure artifacts
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' artifact; do
            relative_path="${artifact#"${E2E_TMPDIR}"/}"
            destination="${E2E_ARTIFACT_DIR}/${relative_path}"
            mkdir -p "$(dirname "${destination}")"
            cp "${artifact}" "${destination}"
          done < <(find "${E2E_TMPDIR}" -type f \( \
            -path "${E2E_TMPDIR}/tuneforge-playback-smoke-*/playback-failure.png" -o \
            -path "${E2E_TMPDIR}/tuneforge-playback-smoke-*/playback-failure-summary.json" -o \
            -path "${E2E_TMPDIR}/tuneforge-diagnostics-smoke-*/artifacts/diagnostics-failure.png" -o \
            -path "${E2E_TMPDIR}/tuneforge-diagnostics-smoke-*/artifacts/summary.json" \
          \) -print0)

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-artifacts
          path: ${{ env.E2E_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 7

      - name: Report E2E job duration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          job_elapsed_seconds=$(($(date +%s) - E2E_JOB_STARTED_AT))
          {
            echo "## E2E job duration"
            echo
            echo "- Job elapsed through final workflow step: ${job_elapsed_seconds}s"
            echo "- Excludes GitHub Actions post-job cleanup."
          } >> "${GITHUB_STEP_SUMMARY}"

  site:
    needs: ci-scope
    if: ${{ always() && (needs.ci-scope.result != 'success' || needs.ci-scope.outputs.site == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require CI scope
        if: needs.ci-scope.result != 'success'
        run: |
          echo "ci-scope did not complete successfully; failing site required check."
          exit 1

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip site checks
        if: needs.ci-scope.outputs.site != 'true'
        run: echo "No site paths changed; skipping site setup."

      - name: Set up pnpm
        if: needs.ci-scope.outputs.site == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Set up Node
        if: needs.ci-scope.outputs.site == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: needs.ci-scope.outputs.site == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify site TypeScript compiler
        if: needs.ci-scope.outputs.site == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(pnpm --filter @tuneforge/site exec tsc --version)"
          printf '%s\n' "${version}"
          if [[ "${version}" != Version\ 7.* ]]; then
            echo "Expected @tuneforge/site tsc to report Version 7.x; got: ${version}" >&2
            exit 1
          fi

      - name: Type-check site
        if: needs.ci-scope.outputs.site == 'true'
        run: pnpm --filter @tuneforge/site typecheck

      - name: Test site
        if: needs.ci-scope.outputs.site == 'true'
        run: pnpm --filter @tuneforge/site test

      - name: Build site
        if: needs.ci-scope.outputs.site == 'true'
        run: pnpm --filter @tuneforge/site build

  backend:
    needs: ci-scope
    if: ${{ always() && (needs.ci-scope.result != 'success' || needs.ci-scope.outputs.backend_static == 'true' || needs.ci-scope.outputs.backend_ffmpeg == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require CI scope
        if: needs.ci-scope.result != 'success'
        run: |
          echo "ci-scope did not complete successfully; failing backend required check."
          exit 1

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip backend checks
        if: needs.ci-scope.outputs.backend_static != 'true' && needs.ci-scope.outputs.backend_ffmpeg != 'true'
        run: echo "No backend paths changed; skipping backend setup."

      - name: Set up Python
        if: needs.ci-scope.outputs.backend_static == 'true' || needs.ci-scope.outputs.backend_ffmpeg == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        if: needs.ci-scope.outputs.backend_static == 'true' || needs.ci-scope.outputs.backend_ffmpeg == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"

      - name: Sync backend dependencies
        if: needs.ci-scope.outputs.backend_static == 'true' || needs.ci-scope.outputs.backend_ffmpeg == 'true'
        working-directory: apps/backend
        run: uv sync --locked --all-groups

      - name: Lint backend
        if: needs.ci-scope.outputs.backend_static == 'true'
        working-directory: apps/backend
        run: uv run --python 3.11 ruff check .

      - name: Type-check backend
        if: needs.ci-scope.outputs.backend_static == 'true'
        working-directory: apps/backend
        run: uv run --python 3.11 mypy app

      - name: Install FFmpeg
        if: needs.ci-scope.outputs.backend_ffmpeg == 'true'
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          elapsed_seconds=$(($(date +%s) - started_at))
          {
            echo "## Backend FFmpeg setup"
            echo
            echo "- Duration: ${elapsed_seconds}s"
            echo "- $(ffmpeg -version | sed -n '1p')"
            echo "- $(ffprobe -version | sed -n '1p')"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Test backend
        if: needs.ci-scope.outputs.backend_ffmpeg == 'true'
        working-directory: apps/backend
        run: uv run --python 3.11 pytest

  desktop_frontend:
    needs: ci-scope
    if: ${{ always() && (needs.ci-scope.result != 'success' || needs.ci-scope.outputs.desktop == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require CI scope
        if: needs.ci-scope.result != 'success'
        run: |
          echo "ci-scope did not complete successfully; failing desktop frontend checks."
          exit 1

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        if: needs.ci-scope.outputs.desktop == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Set up Node
        if: needs.ci-scope.outputs.desktop == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        if: needs.ci-scope.outputs.desktop == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        if: needs.ci-scope.outputs.desktop == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: needs.ci-scope.outputs.desktop == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify desktop TypeScript compiler
        if: needs.ci-scope.outputs.desktop == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(pnpm --filter @tuneforge/desktop exec tsc --version)"
          printf '%s\n' "${version}"
          if [[ "${version}" != Version\ 7.* ]]; then
            echo "Expected @tuneforge/desktop tsc to report Version 7.x; got: ${version}" >&2
            exit 1
          fi

      - name: Sync backend dependencies for OpenAPI generation
        if: needs.ci-scope.outputs.desktop == 'true'
        working-directory: apps/backend
        run: uv sync --locked --all-groups

      - name: Generate shared contracts
        if: needs.ci-scope.outputs.desktop == 'true'
        run: pnpm contracts:generate

      - name: Verify generated contracts are committed
        if: needs.ci-scope.outputs.desktop == 'true'
        run: git diff --exit-code -- packages/shared-types/src/generated/openapi.ts

      - name: Lint desktop
        if: needs.ci-scope.outputs.desktop == 'true'
        run: pnpm --filter @tuneforge/desktop lint

      - name: Type-check desktop
        if: needs.ci-scope.outputs.desktop == 'true'
        run: pnpm --filter @tuneforge/desktop typecheck

      - name: Test desktop
        if: needs.ci-scope.outputs.desktop == 'true'
        run: pnpm --filter @tuneforge/desktop test --run

  desktop_tauri:
    needs: ci-scope
    if: ${{ always() && (needs.ci-scope.result != 'success' || needs.ci-scope.outputs.desktop == 'true') }}
    runs-on: ubuntu-latest
    env:
      RUST_VERSION: "1.97.1"
    steps:
      - name: Require CI scope
        if: needs.ci-scope.result != 'success'
        run: |
          echo "ci-scope did not complete successfully; failing Tauri shell checks."
          exit 1

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        if: needs.ci-scope.outputs.desktop == 'true'
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Cache Cargo dependencies and build output
        if: needs.ci-scope.outputs.desktop == 'true'
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            !apps/desktop/src-tauri/target/debug/incremental
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}

      - name: Install Tauri system dependencies
        if: needs.ci-scope.outputs.desktop == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - name: Check Tauri shell
        if: needs.ci-scope.outputs.desktop == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo check

      - name: Test Tauri shell
        if: needs.ci-scope.outputs.desktop == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo test
