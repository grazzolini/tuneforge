name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci-scope:
    runs-on: ubuntu-latest
    outputs:
      backend_static: ${{ steps.scope.outputs.backend_static }}
      backend_ffmpeg: ${{ steps.scope.outputs.backend_ffmpeg }}
      desktop: ${{ steps.scope.outputs.desktop }}
      site: ${{ steps.scope.outputs.site }}
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Determine CI scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          backend_static=false
          backend_ffmpeg=false
          desktop=false
          site=false
          full_gate=false
          changed_files="${RUNNER_TEMP}/changed-files.txt"

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            full_gate=true
            : > "${changed_files}"
          else
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            if ! git diff --name-only "${base_sha}" "${head_sha}" > "${changed_files}"; then
              echo "Could not compute changed files; running the full gate." >&2
              full_gate=true
              : > "${changed_files}"
            fi
          fi

          if [[ -s "${changed_files}" ]]; then
            while IFS= read -r path; do
              case "${path}" in
                scripts/capture-release-media.mjs|scripts/check-release-version.mjs)
                  site=true
                  ;;
                scripts/package-options*|scripts/flatpak-options*|scripts/playback-smoke*|scripts/sync-validation*|scripts/setup-dev*)
                  ;;
                scripts/*)
                  full_gate=true
                  ;;
                package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                  site=true
                  ;;
                apps/backend/pyproject.toml|apps/backend/uv.lock)
                  backend_static=true
                  backend_ffmpeg=true
                  ;;
                apps/backend/README.md)
                  ;;
                apps/backend/app/api/*|apps/backend/app/schemas.py|apps/backend/app/main.py)
                  backend_static=true
                  backend_ffmpeg=true
                  desktop=true
                  ;;
                apps/backend/*)
                  backend_static=true
                  backend_ffmpeg=true
                  ;;
                packages/shared-types/AGENTS.md)
                  ;;
                apps/desktop/*|packages/shared-types/*)
                  desktop=true
                  ;;
                apps/site/*|.github/workflows/pages.yml)
                  site=true
                  ;;
                .github/workflows/ci.yml|.codex/environments/*|docs/*|README.md|CONTRIBUTING.md|CODE_OF_CONDUCT.md|LICENSE|THIRD_PARTY_NOTICES.md|SECURITY.md|AGENTS.md|.gitignore|packaging/flatpak/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md)
                  ;;
                *)
                  full_gate=true
                  ;;
              esac
            done < "${changed_files}"
          fi

          if [[ "${full_gate}" == "true" ]]; then
            backend_static=true
            backend_ffmpeg=true
            desktop=true
            site=true
          fi

          print_scope_decision() {
            local label="$1"
            local enabled="$2"

            if [[ "${enabled}" == "true" ]]; then
              echo "- Include ${label}"
            else
              echo "- Skip ${label}"
            fi
          }

          echo "Final CI scope decision:"
          print_scope_decision "backend static checks" "${backend_static}"
          print_scope_decision "backend FFmpeg tests" "${backend_ffmpeg}"
          print_scope_decision "desktop checks" "${desktop}"
          print_scope_decision "site checks" "${site}"

          {
            echo "backend_static=${backend_static}"
            echo "backend_ffmpeg=${backend_ffmpeg}"
            echo "desktop=${desktop}"
            echo "site=${site}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## CI scope"
            echo
            echo "- Backend static checks: ${backend_static}"
            echo "- Backend FFmpeg tests: ${backend_ffmpeg}"
            echo "- Desktop checks: ${desktop}"
            echo "- Site checks: ${site}"
            if [[ -s "${changed_files}" ]]; then
              echo
              echo "<details><summary>Changed files</summary>"
              echo
              sed 's/^/- `/' "${changed_files}" | sed 's/$/`/'
              echo
              echo "</details>"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.cjs

      - name: Set up pnpm
        if: github.event_name == 'pull_request'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0

      - name: Set up Node
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install commitlint
        if: github.event_name == 'pull_request'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint PR title (squash commit message)
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint --config commitlint.pr-title.config.cjs

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Test deterministic Node scripts
        run: node --test scripts/package-options.test.mjs scripts/flatpak-options.test.mjs scripts/playback-smoke.test.mjs scripts/sync-validation.test.mjs

      - name: Check release script syntax
        run: |
          node --check scripts/capture-release-media.mjs
          node --check scripts/check-release-version.mjs

      - name: Check release version consistency
        run: node scripts/check-release-version.mjs

      - name: Test setup-dev script
        run: bash scripts/setup-dev.test.sh

  site:
    needs: ci-scope
    if: ${{ always() && (needs.ci-scope.result != 'success' || needs.ci-scope.outputs.site == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require CI scope
        if: needs.ci-scope.result != 'success'
        run: |
          echo "ci-scope did not complete successfully; failing site required check."
          exit 1

      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Skip site checks
        if: needs.ci-scope.outputs.site != 'true'
        run: echo "No site paths changed; skipping site setup."

      - name: Set up pnpm
        if: needs.ci-scope.outputs.site == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0

      - name: Set up Node
        if: needs.ci-scope.outputs.site == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: needs.ci-scope.outputs.site == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check site
        if: needs.ci-scope.outputs.site == 'true'
        run: pnpm --filter @tuneforge/site typecheck

      - name: Build site
        if: needs.ci-scope.outputs.site == 'true'
        run: pnpm --filter @tuneforge/site build

  backend:
    needs: ci-scope
    if: ${{ always() && (needs.ci-scope.result != 'success' || needs.ci-scope.outputs.backend_static == 'true' || needs.ci-scope.outputs.backend_ffmpeg == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require CI scope
        if: needs.ci-scope.result != 'success'
        run: |
          echo "ci-scope did not complete successfully; failing backend required check."
          exit 1

      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Skip backend checks
        if: needs.ci-scope.outputs.backend_static != 'true' && needs.ci-scope.outputs.backend_ffmpeg != 'true'
        run: echo "No backend paths changed; skipping backend setup."

      - name: Set up Python
        if: needs.ci-scope.outputs.backend_static == 'true' || needs.ci-scope.outputs.backend_ffmpeg == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Set up uv
        if: needs.ci-scope.outputs.backend_static == 'true' || needs.ci-scope.outputs.backend_ffmpeg == 'true'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.11"

      - name: Sync backend dependencies
        if: needs.ci-scope.outputs.backend_static == 'true' || needs.ci-scope.outputs.backend_ffmpeg == 'true'
        working-directory: apps/backend
        run: uv sync --locked --all-groups

      - name: Lint backend
        if: needs.ci-scope.outputs.backend_static == 'true'
        working-directory: apps/backend
        run: uv run --python 3.11 ruff check .

      - name: Type-check backend
        if: needs.ci-scope.outputs.backend_static == 'true'
        working-directory: apps/backend
        run: uv run --python 3.11 mypy app

      - name: Install FFmpeg
        if: needs.ci-scope.outputs.backend_ffmpeg == 'true'
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          elapsed_seconds=$(($(date +%s) - started_at))
          {
            echo "## Backend FFmpeg setup"
            echo
            echo "- Duration: ${elapsed_seconds}s"
            echo "- $(ffmpeg -version | sed -n '1p')"
            echo "- $(ffprobe -version | sed -n '1p')"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Test backend
        if: needs.ci-scope.outputs.backend_ffmpeg == 'true'
        working-directory: apps/backend
        run: uv run --python 3.11 pytest

  desktop:
    needs: ci-scope
    if: ${{ always() && (needs.ci-scope.result != 'success' || needs.ci-scope.outputs.desktop == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require CI scope
        if: needs.ci-scope.result != 'success'
        run: |
          echo "ci-scope did not complete successfully; failing desktop required check."
          exit 1

      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Skip desktop checks
        if: needs.ci-scope.outputs.desktop != 'true'
        run: echo "No desktop or contract paths changed; skipping desktop setup."

      - name: Set up pnpm
        if: needs.ci-scope.outputs.desktop == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0

      - name: Set up Node
        if: needs.ci-scope.outputs.desktop == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        if: needs.ci-scope.outputs.desktop == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Set up uv
        if: needs.ci-scope.outputs.desktop == 'true'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.11"

      - name: Set up Rust
        if: needs.ci-scope.outputs.desktop == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Tauri system dependencies
        if: needs.ci-scope.outputs.desktop == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - name: Install dependencies
        if: needs.ci-scope.outputs.desktop == 'true'
        run: pnpm install --frozen-lockfile

      - name: Sync backend dependencies for OpenAPI generation
        if: needs.ci-scope.outputs.desktop == 'true'
        working-directory: apps/backend
        run: uv sync --locked --all-groups

      - name: Generate shared contracts
        if: needs.ci-scope.outputs.desktop == 'true'
        run: pnpm contracts:generate

      - name: Verify generated contracts are committed
        if: needs.ci-scope.outputs.desktop == 'true'
        run: git diff --exit-code -- packages/shared-types/src/generated/openapi.ts

      - name: Lint desktop
        if: needs.ci-scope.outputs.desktop == 'true'
        run: pnpm --filter @tuneforge/desktop lint

      - name: Type-check desktop
        if: needs.ci-scope.outputs.desktop == 'true'
        run: pnpm --filter @tuneforge/desktop typecheck

      - name: Test desktop
        if: needs.ci-scope.outputs.desktop == 'true'
        run: pnpm --filter @tuneforge/desktop test --run

      - name: Check Tauri shell
        if: needs.ci-scope.outputs.desktop == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo check

      - name: Test Tauri shell
        if: needs.ci-scope.outputs.desktop == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo test
