name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  music-core-wasm:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash ${{ github.workspace }}/scripts/ci-image-run.sh script {0}
    env:
      CI_SCOPE_RESULT: success
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Require published image for the current producer sources
        shell: bash
        run: |
          set -euo pipefail
          record="$(GITHUB_OUTPUT=/dev/stdout bash scripts/ci-image-run.sh select)"
          grep -qx 'selection=promoted' <<< "$record"
          printf 'CI_IMAGE_SELECTION=promoted\n' >> "$GITHUB_ENV"

      - name: Load and validate selected CI image
        id: image
        shell: bash
        run: bash scripts/ci-image-run.sh load "$RUNNER_TEMP/ci-image"

      - name: Verify CI image
        run: bash scripts/verify-ci-image.sh

      - name: Install verified music-core WASM from selected image
        run: node scripts/ci-music-core.mjs install

      - name: Verify canonical music-core WASM corpus parity
        run: node packages/music-core/test/runtime-parity.mjs

      - name: Verify music-core WASM boundary behavior
        run: node packages/music-core/test/wasm-boundary.mjs

      - name: Verify music-core artifact metadata boundaries
        run: node packages/music-core/test/artifact-metadata.mjs

      - name: Upload verified music-core WASM
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: music-core-wasm-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/music-core/build/artifacts/wasm/
          if-no-files-found: error
          retention-days: 7

      - name: Clean selected image
        if: always() && steps.image.outputs.identity != ''
        shell: bash
        run: bash scripts/ci-image-run.sh cleanup

  build:
    needs: music-core-wasm
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install capture browser
        run: pnpm --filter @tuneforge/desktop exec playwright install --with-deps chromium

      - name: Require successful music-core WASM producer
        env:
          MUSIC_CORE_ARTIFACT_ID: ${{ needs.music-core-wasm.outputs.artifact_id }}
        run: test -n "$MUSIC_CORE_ARTIFACT_ID" && test '${{ needs.music-core-wasm.result }}' = success

      - name: Download exact same-run music-core WASM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.music-core-wasm.outputs.artifact_id }}
          path: packages/music-core/build/artifacts/wasm
          digest-mismatch: error

      - name: Verify music-core WASM before release media
        run: node scripts/build-music-core.mjs --target wasm --check

      - name: Capture release media
        run: node scripts/capture-release-media.mjs --run

      - name: Build site
        run: pnpm --filter @tuneforge/site build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
