[project]
name = "tuneforge-backend"
version = "1.3.0"
description = "Local API and processing backend for TuneForge."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.19.1,<2.0.0",
  "audioop-lts>=0.2.2; python_version >= '3.13'",
  "cryptography>=50.0.1,<51.0.0",
  "demucs>=4.1.0,<5.0.0",
  "fastapi>=0.141.1,<1.0.0",
  "librosa>=1.0.0,<2.0.0",
  "numpy>=2.5.2,<3.0.0",
  "openai-whisper>=20250625,<20260000",
  "pydantic>=2.13.4,<3.0.0",
  "soundfile>=0.14.0,<1.0.0",
  "sqlalchemy>=2.0.52,<3.0.0",
  "uvicorn>=0.52.4,<1.0.0",
]

[project.optional-dependencies]
advanced-chords = [
  "onnxruntime==1.29.0",
]
advanced-chords-onnx = [
  "onnxruntime==1.29.0",
]
advanced-beats = [
  "beat-this>=1.1.0,<2.0.0",
]
lv-chordia = [
  "lv-chordia @ https://github.com/openmirlab/lv-chordia/archive/9d7de7bbf45efa6731ec8dc62d35280f141c0702.tar.gz",
]

[tool.uv]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "hatchling>=1.32.0,<2.0.0",
  "httpx>=0.28.1,<1.0.0",
  "mypy>=2.3.1,<3.0.0",
  "pytest>=9.1.1,<10.0.0",
  "ruff>=0.16.5,<1.0.0",
  "wheel>=0.48.0,<1.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
addopts = ["--durations=10"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
plugins = []
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
strict_optional = true
packages = ["app"]

[build-system]
requires = ["hatchling>=1.32.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
