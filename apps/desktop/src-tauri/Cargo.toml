[package]
name = "tuneforge"
version = "0.1.0"
description = "Tuneforge desktop shell"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.44", features = ["serde"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
if-addrs = "0.13.4"
rand = "0.8.6"
sha2 = "0.10.9"
snow = "0.9.6"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
cpal = "0.17.3"
signalsmith-stretch = "0.1.3"
symphonia = { version = "0.6.0", default-features = false, features = ["all"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.11"
webkit2gtk = "2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "android")'.dependencies]
android_system_properties = "0.1.5"
ndk-sys = { version = "0.6.0", features = ["media"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
whisper-rs = "0.16.0"
