[package]
name = "tuneforge"
version = "1.0.0"
description = "TuneForge desktop shell"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
chrono = { version = "0.4.44", features = ["serde"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
if-addrs = "0.15.0"
iroh = "1.0.0-rc.0"
iroh-blobs = { version = "0.103.0", features = ["fs-store"] }
rand = "0.10.1"
sha2 = "0.11.0"
snow = "0.10.0"
tokio = { version = "1", features = ["time"] }

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos"))'.dependencies]
cpal = "0.18.1"
signalsmith-stretch = "0.1.3"
symphonia = { version = "0.6.0", default-features = false, features = ["all"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rusqlite = { version = "0.40.0", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.11"
webkit2gtk = "2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "android")'.dependencies]
android_system_properties = "0.1.5"
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
if-addrs = "0.15.0"
iroh = "1.0.0-rc.0"
iroh-blobs = { version = "0.103.0", features = ["fs-store"] }
ndk-sys = { version = "0.6.0", features = ["media"] }
ndk-context = "0.1.1"
rand = "0.10.1"
rusqlite = { version = "0.40.0", features = ["bundled"] }
sha2 = "0.11.0"
snow = "0.10.0"
tauri-plugin-barcode-scanner = "2"
tokio = { version = "1", features = ["time"] }
whisper-rs = "0.16.0"
