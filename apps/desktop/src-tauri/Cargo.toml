[package]
name = "tuneforge"
version = "1.3.0"
description = "TuneForge desktop shell"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-clipboard-manager = "2.3.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
if-addrs = "0.15.0"
iroh = "1.1.0"
iroh-blobs = { version = "0.103.0", features = ["fs-store"] }
rand = "0.10.2"
sha2 = "0.11.0"
snow = "0.10.0"
tokio = { version = "1.53.1", features = ["time"] }

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos"))'.dependencies]
cpal = "0.18.2"
signalsmith-stretch = "0.1.3"
symphonia = { version = "0.6.1", default-features = false, features = ["all"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.12"
webkit2gtk = "2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "android")'.dependencies]
android_system_properties = "0.1.6"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
if-addrs = "0.15.0"
iroh = "1.1.0"
iroh-blobs = { version = "0.103.0", features = ["fs-store"] }
jni = "0.22.4"
ndk-sys = { version = "0.6.0", features = ["media"] }
ndk-context = "0.1.1"
rand = "0.10.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
snow = "0.10.0"
tauri-plugin-barcode-scanner = "2.4.5"
tokio = { version = "1.53.1", features = ["time"] }
whisper-rs = "0.16.0"
