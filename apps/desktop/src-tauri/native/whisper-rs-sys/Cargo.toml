[package]
name = "whisper-rs-sys"
version = "0.15.0"
edition = "2021"
rust-version = "1.88.0"
license = "Unlicense"
links = "whisper"
build = "build.rs"

[features]
coreml = []
cuda = []
force-debug = []
hipblas = []
intel-sycl = []
metal = []
openblas = []
openmp = []
vulkan = []

[lib]
name = "whisper_rs_sys"
path = "src/lib.rs"

[[test]]
name = "build_support"
path = "build_support_test.rs"

[build-dependencies]
bindgen = "0.72"
cfg-if = "1"
cmake = "0.1"
fs_extra = "1.3"
semver = "1.0"

[dev-dependencies]
fs_extra = "1.3"
