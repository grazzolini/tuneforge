app-id: com.tuneforge.desktop
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node26
  - org.freedesktop.Sdk.Extension.llvm20
  - org.freedesktop.Sdk.Extension.rust-stable
command: tuneforge
add-extensions:
  com.tuneforge.desktop.Torch.Stack.Nvidia:
    directory: lib/tuneforge/backend/torch-extensions/Nvidia
    version: stable
    subdirectories: true
    merge-dirs: site-packages
    no-autodownload: true
    autodelete: true
  com.tuneforge.desktop.Torch.Stack.Nvidia.Core:
    directory: lib/tuneforge/backend/torch-extensions/Nvidia/Core
    version: stable
    bundle: true
    no-autodownload: true
    autodelete: true
  com.tuneforge.desktop.Torch.Stack.Nvidia.Runtime:
    directory: lib/tuneforge/backend/torch-extensions/Nvidia/Runtime
    version: stable
    bundle: true
    no-autodownload: true
    autodelete: true
  com.tuneforge.desktop.Torch.Stack.LegacyNvidia:
    directory: lib/tuneforge/backend/torch-extensions/LegacyNvidia
    version: stable
    subdirectories: true
    merge-dirs: site-packages
    no-autodownload: true
    autodelete: true
  com.tuneforge.desktop.Torch.Stack.LegacyNvidia.Core:
    directory: lib/tuneforge/backend/torch-extensions/LegacyNvidia/Core
    version: stable
    bundle: true
    no-autodownload: true
    autodelete: true
  com.tuneforge.desktop.Torch.Stack.LegacyNvidia.Runtime:
    directory: lib/tuneforge/backend/torch-extensions/LegacyNvidia/Runtime
    version: stable
    bundle: true
    no-autodownload: true
    autodelete: true
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=xdg-data/tuneforge:create
  - --filesystem=xdg-cache/torch:create
  - --filesystem=xdg-cache/whisper:create
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.Documents
  - --system-talk-name=org.freedesktop.login1
  - --env=TUNEFORGE_BUNDLED_BACKEND_ROOT=/app/lib/tuneforge/backend
  - --env=TUNEFORGE_DATA_DIR=~/.local/share/tuneforge
  - --env=TUNEFORGE_FFMPEG_PATH=/app/bin/ffmpeg
  - --env=TUNEFORGE_FFPROBE_PATH=/app/bin/ffprobe
  - --env=TORCH_HOME=~/.cache/torch
  - --env=TUNEFORGE_LYRICS_CACHE_DIR=~/.cache/whisper
cleanup:
  - /bin/pnpm
  - /bin/pnpx
  - /include
  - /lib/pnpm
  - /lib/pkgconfig
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - /share/tuneforge/node-sources
  - /share/tuneforge/build
  - /bin/sccache
  - "*.a"
  - "*.la"
cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/lib/tuneforge/backend/torch-extensions/Nvidia ${FLATPAK_DEST}/lib/tuneforge/backend/torch-extensions/LegacyNvidia

modules:
  - name: pnpm
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node26/bin
    sources:
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.22.0.tgz
        sha256: 57a97e6f23a3faffc03153a4ef8c770a0552612b8640aebe39bfdd5754d0ebdc
        dest: pnpm
    build-commands:
      - install -dm755 /app/lib/pnpm /app/bin
      - cp -a pnpm/. /app/lib/pnpm/
      - ln -sf ../lib/pnpm/bin/pnpm.mjs /app/bin/pnpm
      - ln -sf ../lib/pnpm/bin/pnpx.mjs /app/bin/pnpx
      - /app/bin/pnpm --version

  - name: node-sources
    buildsystem: simple
    sources:
      - generated/node-sources.json
    build-commands:
      - install -dm755 /app/share/tuneforge/node-sources
      - cp node-sources/*.tgz /app/share/tuneforge/node-sources/

  - name: tuneforge-frontend
    buildsystem: simple
    build-options:
      append-path: /app/bin:/usr/lib/sdk/node26/bin
      build-args:
        - "@@FLATPAK_CACHE_BIND@@"
      env:
        HUSKY: "0"
        TUNEFORGE_VERSION_FILE: /run/build/tuneforge-frontend/frontend-version.json
    sources:
      - type: file
        path: ../../package.json
      - type: file
        path: ../../pnpm-lock.yaml
      - type: file
        path: ../../pnpm-workspace.yaml
      - type: file
        path: ../../scripts/build-info.mjs
        dest: scripts
      - type: file
        path: seed-pnpm-store.mjs
      - type: file
        path: ../../apps/desktop/package.json
        dest: apps/desktop
      - type: file
        path: ../../apps/desktop/index.html
        dest: apps/desktop
      - type: file
        path: ../../apps/desktop/tsconfig.json
        dest: apps/desktop
      - type: file
        path: ../../apps/desktop/tsconfig.node.json
        dest: apps/desktop
      - type: file
        path: ../../apps/desktop/vite.config.ts
        dest: apps/desktop
      - type: dir
        path: ../../apps/desktop/src
        dest: apps/desktop/src
      - type: file
        path: ../../packages/shared-types/package.json
        dest: packages/shared-types
      - type: dir
        path: ../../packages/shared-types/src
        dest: packages/shared-types/src
      - type: file
        path: generated/frontend-version.json
        dest-filename: frontend-version.json
    build-commands:
      - node seed-pnpm-store.mjs /app/share/tuneforge/node-sources /run/tuneforge-cache/@@FLATPAK_CACHE_NAMESPACE@@/pnpm/store /run/tuneforge-cache/@@FLATPAK_CACHE_NAMESPACE@@/pnpm/cache /app/bin/pnpm /run/tuneforge-cache/@@FLATPAK_CACHE_NAMESPACE@@/pnpm-report.json
      - /app/bin/pnpm --filter @tuneforge/desktop build
      - install -dm755 /app/share/tuneforge/build/frontend-dist
      - cp -a apps/desktop/dist/. /app/share/tuneforge/build/frontend-dist/

  - name: sccache
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/mozilla/sccache/releases/download/v0.17.0/sccache-v0.17.0-x86_64-unknown-linux-musl.tar.gz
        sha256: 67c4a96dd237c1f518f6b36083f270f9976d516f1e57fce891755ea782e50006
    build-commands:
      - install -Dm755 sccache /app/bin/sccache
      - /app/bin/sccache --version

  - name: tuneforge-desktop
    buildsystem: simple
    build-options:
      append-path: /app/bin:/usr/lib/sdk/llvm20/bin:/usr/lib/sdk/rust-stable/bin
      build-args:
        - "@@FLATPAK_CACHE_BIND@@"
      env:
        CARGO_HOME: /run/build/tuneforge-desktop/cargo-home
        CARGO_INCREMENTAL: "0"
        CARGO_NET_OFFLINE: "true"
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
        RUSTC_WRAPPER: /app/bin/sccache
        SCCACHE_DIR: /run/tuneforge-cache/@@FLATPAK_CACHE_NAMESPACE@@/sccache
        TUNEFORGE_GIT_REF: '@@TUNEFORGE_FRONTEND_GIT_REF@@'
    sources:
      - type: file
        path: ../../apps/desktop/src-tauri/Cargo.lock
        dest: apps/desktop/src-tauri
      - type: file
        path: ../../apps/desktop/src-tauri/Cargo.toml
        dest: apps/desktop/src-tauri
      - type: file
        path: ../../apps/desktop/src-tauri/build.rs
        dest: apps/desktop/src-tauri
      - type: file
        path: ../../apps/desktop/src-tauri/tauri.conf.json
        dest: apps/desktop/src-tauri
      - type: dir
        path: ../../apps/desktop/src-tauri/capabilities
        dest: apps/desktop/src-tauri/capabilities
      - type: dir
        path: ../../apps/desktop/src-tauri/icons
        dest: apps/desktop/src-tauri/icons
      - type: dir
        path: ../../apps/desktop/src-tauri/resources
        dest: apps/desktop/src-tauri/resources
      - type: dir
        path: ../../apps/desktop/src-tauri/src
        dest: apps/desktop/src-tauri/src
      - generated/cargo-sources.json
    build-commands:
      - install -dm755 apps/desktop/dist
      - cp -a /app/share/tuneforge/build/frontend-dist/. apps/desktop/dist/
      - bash cargo-checksums.sh
      - flock /run/tuneforge-cache/@@FLATPAK_CACHE_NAMESPACE@@/sccache.lock sh -c 'set -eu; sccache --start-server; trap "sccache --stop-server >/dev/null 2>&1 || true" EXIT; sccache --zero-stats; cargo build --release --locked --features custom-protocol --manifest-path apps/desktop/src-tauri/Cargo.toml; sccache --show-stats --stats-format=json > /run/tuneforge-cache/@@FLATPAK_CACHE_NAMESPACE@@/sccache-stats.json.tmp; mv /run/tuneforge-cache/@@FLATPAK_CACHE_NAMESPACE@@/sccache-stats.json.tmp /run/tuneforge-cache/@@FLATPAK_CACHE_NAMESPACE@@/sccache-stats.json'
      - install -Dm755 apps/desktop/src-tauri/target/release/tuneforge /app/bin/tuneforge

  - name: cpython-3.14
    buildsystem: simple
    build-options:
      env:
        LD_LIBRARY_PATH: /app/lib/tuneforge/backend/python/lib
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.14.7/Python-3.14.7.tar.xz
        sha256: 3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81
    build-commands:
      - ./configure --prefix=/app/lib/tuneforge/backend/python --enable-shared --with-ensurepip=install
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
      - /app/lib/tuneforge/backend/python/bin/python3.14 -m ensurepip --upgrade
      - find /app/lib/tuneforge/backend/python -type d -name __pycache__ -prune -exec rm -rf {} +
      - find /app/lib/tuneforge/backend/python -type f -name '*.pyc' -delete

  - name: python-runtime-deps
    buildsystem: simple
    build-options:
      env:
        LD_LIBRARY_PATH: /app/lib/tuneforge/backend/python/lib
        PYTHONPATH: /app/lib/tuneforge/backend/site-packages
        TMPDIR: /run/build/python-runtime-deps/.pip-tmp
    sources:
      - generated/python-sources.json
      - type: file
        path: generated/python-requirements.txt
    build-commands:
      - install -dm755 /app/lib/tuneforge/backend/site-packages
      - install -dm700 /run/build/python-runtime-deps/.pip-tmp
      - /app/lib/tuneforge/backend/python/bin/python3.14 -m pip install --no-index --find-links=python-sources --target=/app/lib/tuneforge/backend/site-packages setuptools wheel
      - /app/lib/tuneforge/backend/python/bin/python3.14 -m pip install --no-index --no-build-isolation --find-links=python-sources --target=/app/lib/tuneforge/backend/site-packages -r python-requirements.txt
      - rm -rf /run/build/python-runtime-deps/.pip-tmp
      - find /app/lib/tuneforge/backend/site-packages -type d -name __pycache__ -prune -exec rm -rf {} +
      - find /app/lib/tuneforge/backend/site-packages -type f -name '*.pyc' -delete

  - name: nvidia-torch-core-extension
    buildsystem: simple
    build-options:
      env:
        LD_LIBRARY_PATH: /app/lib/tuneforge/backend/python/lib
        TMPDIR: /run/build/nvidia-torch-core-extension/.pip-tmp
    sources:
      - generated/python-nvidia-torch-core-sources.json
      - type: file
        path: generated/python-nvidia-torch-core-requirements.txt
      - type: file
        path: generated/nvidia-torch-core-profile.json
    build-commands:
      - install -dm755 /app/lib/tuneforge/backend/torch-extensions/Nvidia/Core/site-packages
      - install -dm700 /run/build/nvidia-torch-core-extension/.pip-tmp
      - /app/lib/tuneforge/backend/python/bin/python3.14 -m pip install --no-index --no-deps --find-links=python-sources --target=/app/lib/tuneforge/backend/torch-extensions/Nvidia/Core/site-packages -r python-nvidia-torch-core-requirements.txt
      - install -Dm644 nvidia-torch-core-profile.json /app/lib/tuneforge/backend/torch-extensions/Nvidia/Core/profile.json
      - rm -rf /run/build/nvidia-torch-core-extension/.pip-tmp
      - find /app/lib/tuneforge/backend/torch-extensions/Nvidia/Core/site-packages -type d -name __pycache__ -prune -exec rm -rf {} +
      - find /app/lib/tuneforge/backend/torch-extensions/Nvidia/Core/site-packages -type f -name '*.pyc' -delete

  - name: nvidia-torch-runtime-extension
    buildsystem: simple
    build-options:
      env:
        LD_LIBRARY_PATH: /app/lib/tuneforge/backend/python/lib
        TMPDIR: /run/build/nvidia-torch-runtime-extension/.pip-tmp
    sources:
      - generated/python-nvidia-torch-runtime-sources.json
      - type: file
        path: generated/python-nvidia-torch-runtime-requirements.txt
      - type: file
        path: generated/nvidia-torch-runtime-profile.json
    build-commands:
      - install -dm755 /app/lib/tuneforge/backend/torch-extensions/Nvidia/Runtime/site-packages
      - install -dm700 /run/build/nvidia-torch-runtime-extension/.pip-tmp
      - /app/lib/tuneforge/backend/python/bin/python3.14 -m pip install --no-index --no-deps --find-links=python-sources --target=/app/lib/tuneforge/backend/torch-extensions/Nvidia/Runtime/site-packages -r python-nvidia-torch-runtime-requirements.txt
      - install -Dm644 nvidia-torch-runtime-profile.json /app/lib/tuneforge/backend/torch-extensions/Nvidia/Runtime/profile.json
      - rm -rf /run/build/nvidia-torch-runtime-extension/.pip-tmp
      - find /app/lib/tuneforge/backend/torch-extensions/Nvidia/Runtime/site-packages -type d -name __pycache__ -prune -exec rm -rf {} +
      - find /app/lib/tuneforge/backend/torch-extensions/Nvidia/Runtime/site-packages -type f -name '*.pyc' -delete

  - name: legacy-nvidia-torch-core-extension
    buildsystem: simple
    build-options:
      env:
        LD_LIBRARY_PATH: /app/lib/tuneforge/backend/python/lib
        TMPDIR: /run/build/legacy-nvidia-torch-core-extension/.pip-tmp
    sources:
      - generated/python-legacy-torch-core-sources.json
      - type: file
        path: generated/python-legacy-torch-core-requirements.txt
      - type: file
        path: generated/legacy-torch-core-profile.json
    build-commands:
      - install -dm755 /app/lib/tuneforge/backend/torch-extensions/LegacyNvidia/Core/site-packages
      - install -dm700 /run/build/legacy-nvidia-torch-core-extension/.pip-tmp
      - /app/lib/tuneforge/backend/python/bin/python3.14 -m pip install --no-index --no-deps --find-links=python-sources --target=/app/lib/tuneforge/backend/torch-extensions/LegacyNvidia/Core/site-packages -r python-legacy-torch-core-requirements.txt
      - install -Dm644 legacy-torch-core-profile.json /app/lib/tuneforge/backend/torch-extensions/LegacyNvidia/Core/profile.json
      - rm -rf /run/build/legacy-nvidia-torch-core-extension/.pip-tmp
      - find /app/lib/tuneforge/backend/torch-extensions/LegacyNvidia/Core/site-packages -type d -name __pycache__ -prune -exec rm -rf {} +
      - find /app/lib/tuneforge/backend/torch-extensions/LegacyNvidia/Core/site-packages -type f -name '*.pyc' -delete

  - name: legacy-nvidia-torch-runtime-extension
    buildsystem: simple
    build-options:
      env:
        LD_LIBRARY_PATH: /app/lib/tuneforge/backend/python/lib
        TMPDIR: /run/build/legacy-nvidia-torch-runtime-extension/.pip-tmp
    sources:
      - generated/python-legacy-torch-runtime-sources.json
      - type: file
        path: generated/python-legacy-torch-runtime-requirements.txt
      - type: file
        path: generated/legacy-torch-runtime-profile.json
    build-commands:
      - install -dm755 /app/lib/tuneforge/backend/torch-extensions/LegacyNvidia/Runtime/site-packages
      - install -dm700 /run/build/legacy-nvidia-torch-runtime-extension/.pip-tmp
      - /app/lib/tuneforge/backend/python/bin/python3.14 -m pip install --no-index --no-deps --find-links=python-sources --target=/app/lib/tuneforge/backend/torch-extensions/LegacyNvidia/Runtime/site-packages -r python-legacy-torch-runtime-requirements.txt
      - install -Dm644 legacy-torch-runtime-profile.json /app/lib/tuneforge/backend/torch-extensions/LegacyNvidia/Runtime/profile.json
      - rm -rf /run/build/legacy-nvidia-torch-runtime-extension/.pip-tmp
      - find /app/lib/tuneforge/backend/torch-extensions/LegacyNvidia/Runtime/site-packages -type d -name __pycache__ -prune -exec rm -rf {} +
      - find /app/lib/tuneforge/backend/torch-extensions/LegacyNvidia/Runtime/site-packages -type f -name '*.pyc' -delete

  - name: pulseaudio-client-tools
    buildsystem: meson
    builddir: true
    config-opts:
      - --buildtype=release
      - -Ddaemon=false
      - -Dclient=true
      - -Ddoxygen=false
      - -Dman=false
      - -Dtests=false
      - -Ddatabase=simple
      - -Dalsa=disabled
      - -Dasyncns=disabled
      - -Davahi=disabled
      - -Dbluez5=disabled
      - -Dbluez5-gstreamer=disabled
      - -Dconsolekit=disabled
      - -Ddbus=disabled
      - -Delogind=disabled
      - -Dfftw=disabled
      - -Dglib=disabled
      - -Dgsettings=disabled
      - -Dgstreamer=disabled
      - -Dgtk=disabled
      - -Djack=disabled
      - -Dlirc=disabled
      - -Dopenssl=disabled
      - -Dorc=disabled
      - -Doss-output=disabled
      - -Dsamplerate=disabled
      - -Dsoxr=disabled
      - -Dspeex=disabled
      - -Dsystemd=disabled
      - -Dtcpwrap=disabled
      - -Dudev=disabled
      - -Dvalgrind=disabled
      - -Dx11=disabled
      - -Dwebrtc-aec=disabled
      - -Dbashcompletiondir=no
      - -Dzshcompletiondir=no
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/pulseaudio/releases/pulseaudio-17.0.tar.xz
        sha256: 053794d6671a3e397d849e478a80b82a63cb9d8ca296bd35b73317bb5ceb87b5
    cleanup:
      - /bin/pacat
      - /bin/pacmd
      - /bin/padsp
      - /bin/pasuspender
      - /bin/pax11publish
      - /bin/pulseaudio
      - /share/bash-completion
      - /share/zsh

  - name: tuneforge-backend
    buildsystem: simple
    build-options:
      env:
        LD_LIBRARY_PATH: /app/lib/tuneforge/backend/python/lib
        PYTHONPATH: /app/lib/tuneforge/backend/site-packages
    sources:
      - type: file
        path: ../../README.md
      - type: file
        path: ../../LICENSE
      - type: file
        path: ../../THIRD_PARTY_NOTICES.md
      - type: file
        path: ../../LICENSES/crema-0.2.0-BSD-2-Clause.txt
        dest: LICENSES
      - type: file
        path: ../../docs/PACKAGING.md
        dest: docs
      - type: dir
        path: ../../apps/backend/app
        dest: apps/backend/app
      - type: dir
        path: ../../apps/backend/alembic
        dest: apps/backend/alembic
      - type: file
        path: ../../apps/backend/alembic.ini
        dest: apps/backend
      - type: file
        path: ../../apps/backend/pyproject.toml
        dest: apps/backend
      - type: file
        path: ../../packaging/demucs/models.json
        dest: apps/backend
        dest-filename: demucs-models.json
      - type: file
        path: ffmpeg-wrapper.sh
        dest-filename: ffmpeg
      - type: file
        path: ffprobe-wrapper.sh
        dest-filename: ffprobe
      - type: file
        path: com.tuneforge.desktop.desktop
      - type: file
        path: com.tuneforge.desktop.metainfo.xml
      - type: file
        path: ../../apps/desktop/src-tauri/icons/32x32.png
        dest: icons
      - type: file
        path: ../../apps/desktop/src-tauri/icons/128x128.png
        dest: icons
      - type: file
        path: ../../apps/desktop/src-tauri/icons/512x512.png
        dest: icons
      - type: file
        path: generated/version.json
    build-commands:
      - install -Dm755 ffmpeg /app/bin/ffmpeg
      - install -Dm755 ffprobe /app/bin/ffprobe
      - /app/bin/ffmpeg -version
      - /app/bin/ffprobe -version
      - /app/bin/pactl --version
      - install -Dm644 version.json /app/lib/tuneforge/backend/version.json
      - install -dm755 /app/lib/tuneforge/backend/src
      - cp -a apps/backend/app /app/lib/tuneforge/backend/src/app
      - cp -a apps/backend/alembic /app/lib/tuneforge/backend/src/alembic
      - install -Dm644 apps/backend/alembic.ini /app/lib/tuneforge/backend/src/alembic.ini
      - install -Dm644 apps/backend/pyproject.toml /app/lib/tuneforge/backend/src/pyproject.toml
      - install -Dm644 apps/backend/demucs-models.json /app/lib/tuneforge/backend/src/demucs-models.json
      - install -Dm644 com.tuneforge.desktop.desktop /app/share/applications/com.tuneforge.desktop.desktop
      - install -Dm644 com.tuneforge.desktop.metainfo.xml /app/share/metainfo/com.tuneforge.desktop.metainfo.xml
      - install -Dm644 README.md /app/share/doc/tuneforge/README.md
      - install -Dm644 LICENSE /app/share/doc/tuneforge/LICENSE
      - install -Dm644 THIRD_PARTY_NOTICES.md /app/share/doc/tuneforge/THIRD_PARTY_NOTICES.md
      - install -Dm644 LICENSES/crema-0.2.0-BSD-2-Clause.txt /app/share/doc/tuneforge/LICENSES/crema-0.2.0-BSD-2-Clause.txt
      - install -Dm644 docs/PACKAGING.md /app/share/doc/tuneforge/PACKAGING.md
      - install -Dm644 icons/32x32.png /app/share/icons/hicolor/32x32/apps/com.tuneforge.desktop.png
      - install -Dm644 icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.tuneforge.desktop.png
      - install -Dm644 icons/512x512.png /app/share/icons/hicolor/512x512/apps/com.tuneforge.desktop.png
      - /app/lib/tuneforge/backend/python/bin/python3.14 -c "import fastapi, demucs, whisper, torch"
      - rm -rf /app/share/tuneforge/build /app/share/tuneforge/node-sources /app/lib/pnpm /app/bin/pnpm /app/bin/pnpx /app/bin/sccache
